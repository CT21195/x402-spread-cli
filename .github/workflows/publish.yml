# ONE-TIME bootstrap: publishes to npm on a GitHub Release using a token.
# Only needed for a package's FIRST publish (npm can't attach a trusted
# publisher to a package page that doesn't exist yet).
# Setup: GitHub repo -> Settings -> Secrets and variables -> Actions ->
#   New repository secret: name NPM_TOKEN, value = your granular npm token.
# After v1.0.0 is live on npmjs.com, switch to the OIDC workflow and delete
# the NPM_TOKEN secret.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm install
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
